name: Async MQTT client CI

on:
  push:
  pull_request:

jobs:
  build-pio:
    name: PlatformIO ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP8266
            board: esp12e
            example: examples/FullyFeatured-ESP8266
            platform: ""
          - name: ESP32 Arduino 2
            board: esp32dev
            example: examples/FullyFeatured-ESP32
            platform: platformio/espressif32@6.13.0
          - name: ESP32 Arduino 3
            board: esp32dev
            example: examples/FullyFeatured-ESP32
            platform: https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio intelhex
      - name: Build example
        run: |
          args=(--lib=. --board "${{ matrix.board }}" -O "lib_compat_mode=strict")
          if [ -n "${{ matrix.platform }}" ]; then
            args+=(-O "platform=${{ matrix.platform }}")
          fi
          pio ci "${args[@]}" "${{ matrix.example }}"

  package:
    name: Validate PlatformIO package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio
      - name: Validate package contents
        run: |
          set -eu
          package_path=$(mktemp --suffix=.tar.gz)
          trap 'rm -f "$package_path"' EXIT

          pio pkg pack --output "$package_path"
          tar -tzf "$package_path" | grep -Fxq "src/AsyncMqttClient.cpp"
          test "$(stat -c %s "$package_path")" -lt 1048576
